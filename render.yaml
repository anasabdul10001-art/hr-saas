services:
  - type: web
    name: nawa-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      # Postgres is external (Supabase free tier) rather than Render's own managed Postgres -
      # Render's free Postgres plan is capped at one per account, and this account's slot is
      # already used by another project. Paste the Supabase connection string (Session Pooler,
      # port 6543 - see Supabase Project Settings -> Database) here in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://nawa-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://nawa-frontend.onrender.com
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    runtime: static
    name: nawa-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://nawa-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
